# Iris quadrotor dynamics (3DR Iris / PX4 standard model)
# Paper1_MS generalization platform — medium size, high inertia
# Source: PX4 official iris.sdf
#   https://github.com/PX4/PX4-SITL_gazebo-classic
#   PX4 iris.sdf actual values:
#   mass=1.5, ixx=0.029125, iyy=0.029125, izz=0.055225
#   motorConstant=5.84e-06, momentConstant=0.06
#   maxRotVelocity=1100 rad/s, arm=0.275m (550mm motor-to-motor / 2)
quadrotor_dynamics:
  mass: 1.5
  arm_l: 0.275
  motor_omega_min: 0.0
  motor_omega_max: 10505.0
  motor_tau: 0.0125
  thrust_map: [5.84e-06, 0.0, 0.0]
  kappa: 0.06
  omega_max: [6.2831852, 6.2831852, 3.1415926]
  inertia: [0.029125, 0.029125, 0.055225]
  P_rate: [45, 45, 60]

quadrotor_env:
  camera: no
  sim_dt: 0.02
  max_t: 10.0
  add_camera: yes

rl:
  pos_coeff: -0.02
  ori_coeff: -0.02
  lin_vel_coeff: -0.0002
  ang_vel_coeff: -0.0002
  act_coeff: 0
