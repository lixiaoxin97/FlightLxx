# Crazyflie 2.0 quadrotor dynamics
# Paper1_MS generalization platform — micro, near-zero inertia
quadrotor_dynamics:
  mass: 0.027
  arm_l: 0.044
  motor_omega_min: 0.0
  motor_omega_max: 25000.0
  motor_tau: 0.0001
  thrust_map: [1.28192e-08, 0.0, 0.0]
  kappa: 0.005964552
  omega_max: [6.2831852, 6.2831852, 3.1415926]
  inertia: [1.6571710e-05, 1.6655602e-05, 2.9261652e-05]
  P_rate: [250, 250, 120]

quadrotor_env:
  camera: no
  sim_dt: 0.02
  max_t: 10.0
  add_camera: yes

rl:
  pos_coeff: -0.02
  ori_coeff: -0.02
  lin_vel_coeff: -0.0002
  ang_vel_coeff: -0.0002
  act_coeff: 0
